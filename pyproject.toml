[project]
name = "ai-inquiry-processing-agent"
version = "1.0.0"
description = "AI agent for processing foreign-trade buyer inquiries end to end."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "langgraph>=0.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
openai = ["openai>=1.40.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
